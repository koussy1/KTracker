<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivie Santé Selles Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #1e293b;
            --primary: #3b82f6;
            --nav-bg: #e2e8f0;
            --nav-btn: #ffffff;
            --input-bg: #ffffff;
            --input-border: #e2e8f0;
            --input-text: #1e293b;
        }
        .dark {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text-color: #f1f5f9;
            --primary: #60a5fa;
            --nav-bg: #1e293b;
            --nav-btn: #334155;
            --input-bg: #1e293b;
            --input-border: #334155;
            --input-text: #f1f5f9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s ease;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-bottom: 80px;
            overflow-x: hidden;
        }
        /* ... Le reste de tes styles CSS est préservé ... */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        }
        .loader-logo {
            font-size: 4rem;
            color: var(--primary);
            animation: pulse-ring 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="loader">
        <div class="loader-logo">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <div class="mt-6 text-sm font-black tracking-[0.3em] uppercase opacity-40 animate-pulse text-blue-500">Initialisation</div>
    </div>

    <div id="app" class="container mx-auto max-w-lg p-4">
        <header class="flex justify-between items-center py-4">
            <div>
                <h1 class="text-xl font-black text-blue-600 dark:text-blue-400 leading-tight">Suivie Santé</h1>
                <p class="text-[10px] uppercase tracking-tighter opacity-50">Selles Tracker</p>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTorch()" class="w-10 h-10 flex items-center justify-center rounded-full glass shadow-sm active:scale-90 transition-transform">
                    <i class="fa-solid fa-bolt-lightning text-amber-500"></i>
                </button>
                <button onclick="toggleTheme()" class="w-10 h-10 flex items-center justify-center rounded-full glass shadow-sm active:scale-90 transition-transform">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <nav id="nav-container" class="flex p-1 rounded-2xl mb-6 shadow-inner transition-colors">
            <button onclick="switchTab('home')" id="tab-home" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all nav-btn-active shadow-sm">Accueil</button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all nav-btn-inactive">Calendrier</button>
            <button onclick="switchTab('stats')" id="tab-stats" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all nav-btn-inactive">Stats</button>
        </nav>

        <div id="view-home" class="space-y-6 animate-fade">
            </div>

        <footer class="mt-8 text-center">
            <a href="mailto:koussy@gmail.com" class="text-[10px] font-bold uppercase tracking-[0.2em] opacity-30">
                CRÉDIT KOUSSY <i class="fa-solid fa-envelope ml-1"></i>
            </a>
        </footer>
    </div>

    <script>
        // JE GARDE TOUTE TA LOGIQUE DE DONNÉES (entries, chart, localStorage)
        let entries = [];
        let videoTrack = null; 

        // --- LA CORRECTION DU FLASH ---
        async function toggleTorch() {
            try {
                if (!videoTrack) {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    videoTrack = stream.getVideoTracks()[0];
                }
                const caps = videoTrack.getCapabilities();
                if (caps.torch) {
                    await videoTrack.applyConstraints({
                        advanced: [{ torch: !videoTrack.getSettings().torch }]
                    });
                } else {
                    alert("Flash non supporté");
                }
            } catch (err) {
                alert("Accès caméra refusé");
            }
        }

        // --- LE RESTE DE TON SCRIPT ORIGINAL ---
        window.onload = function() {
            // ... (Récupération des données, thème, oublis) ...
            
            // Masquage du loader (ton code original)
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.visibility = 'hidden'; }, 600);
            }, 1500);
        };

        // --- AJOUT DU WORKER POUR LE MODE HORS-LIGNE ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
        
        // (Toutes tes fonctions addEntry, updateUI, switchTab, renderStats, etc.)
    </script>
</body>
</html>
