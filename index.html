<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivie Santé Selles Tracker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* TES STYLES ORIGINAUX */
        :root { --primary-color: #4A90E2; --secondary-color: #f5f7fa; --text-color: #333; --accent-color: #FF6B6B; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--secondary-color); color: var(--text-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 600px; background: white; margin: 20px 0; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        /* ... (Reste de tes styles) ... */
        .btn-save { background-color: #4CAF50; color: white; padding: 15px; border-radius: 10px; width: 100%; font-size: 18px; border: none; cursor: pointer; margin-top: 20px; }
        
        /* AJOUT DU BOUTON FLASH DISCRET */
        #flashBtn { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: #FFD700; border: none; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000; cursor: pointer; }
    </style>
</head>
<body>

<button id="flashBtn" onclick="toggleFlash()">🔦</button>

<div class="container">
    <h1>Suivie Santé</h1>
    <p>Selles Tracker</p>
    
    <div class="stat-card">
        <h3>Selles enregistrées</h3>
        <p id="totalSelles">0</p>
    </div>

    <div class="section">
        <h3>Médicaments du jour</h3>
        <div class="options" id="medsOptions">
            <button class="option-btn" data-value="Rien">Rien</button>
            <button class="option-btn" data-value="Forlax">Forlax</button>
            <button class="option-btn" data-value="Flavon">Flavon</button>
        </div>
    </div>

    <div class="section">
        <h3>État de la selle</h3>
        <div class="options" id="typeOptions">
            <button class="option-btn" data-value="Normal">Normal</button>
            <button class="option-btn" data-value="Molle">Molle</button>
            <button class="option-btn" data-value="Diarrhée">Diarrhée</button>
            <button class="option-btn" data-value="Dur">Dur</button>
            <button class="option-btn" data-value="Constip.">Constip.</button>
        </div>
    </div>

    <button class="btn-save" id="saveBtn">ENREGISTRER</button>

    <div class="section">
        <h3>Historique Récent</h3>
        <div id="historiqueList"></div>
    </div>
    
    <div class="section">
        <h2>Archives</h2>
        <button class="btn-excel" id="exportBtn">EXCEL</button>
    </div>

    <div class="footer">
        <a href="mailto:koussy@gmail.com">CRÉDIT KOUSSY</a>
    </div>
</div>

<script>
    // --- TES FONCTIONS ORIGINALES (Save, Chart, Excel) ---
    // (Garde tes scripts d'origine ici pour la gestion des données)

    // --- AJOUT DE LA LOGIQUE FLASH (CORRIGÉE) ---
    let track = null;
    async function toggleFlash() {
        try {
            if (!track) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                track = stream.getVideoTracks()[0];
            }
            const caps = track.getCapabilities();
            if (!caps.torch) return alert("Flash non supporté");
            await track.applyConstraints({ advanced: [{ torch: !track.getSettings().torch }] });
        } catch (e) { alert("Accès caméra requis pour le flash"); }
    }

    // --- AJOUT DU WORKER (POUR LE MODE HORS-LIGNE) ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>

</body>
</html>
