<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivie Santé Selles Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #f8fafc; --card-bg: rgba(255, 255, 255, 0.9); --text-color: #1e293b; --primary: #3b82f6; --nav-bg: #e2e8f0; --nav-btn: #ffffff; --input-bg: #ffffff; --input-border: #e2e8f0; --input-text: #1e293b; }
        .dark { --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.8); --text-color: #f1f5f9; --primary: #60a5fa; --nav-bg: #1e293b; --nav-btn: #334155; --input-bg: #1e293b; --input-border: #334155; --input-text: #f1f5f9; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: background 0.3s ease; font-family: 'Segoe UI', system-ui, sans-serif; padding-bottom: 80px; overflow-x: hidden; }
        input, select, textarea { background-color: var(--input-bg) !important; color: var(--input-text) !important; border: 1px solid var(--input-border) !important; }
        #loader { position: fixed; inset: 0; z-index: 9999; background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s; }
        .loader-logo { font-size: 4rem; color: var(--primary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.5; } 50% { transform: scale(1); opacity: 1; } }
        .glass { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-main { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .animate-fade { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #nav-container { background-color: var(--nav-bg); }
        .nav-btn-active { background-color: var(--nav-btn) !important; color: var(--primary) !important; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loader">
        <div class="loader-logo"><i class="fa-solid fa-heart-pulse"></i></div>
        <div class="mt-6 text-sm font-black tracking-[0.3em] uppercase opacity-40 animate-pulse text-blue-500">Initialisation</div>
    </div>

    <div id="app" class="container mx-auto max-w-lg p-4">
        <header class="flex justify-between items-center py-4">
            <div>
                <h1 class="text-xl font-black text-blue-600 dark:text-blue-400">Suivie Santé</h1>
                <p class="text-[10px] uppercase opacity-50">Selles Tracker</p>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTorch()" class="w-10 h-10 flex items-center justify-center rounded-full glass shadow-sm"><i class="fa-solid fa-bolt-lightning text-amber-500"></i></button>
                <button onclick="toggleTheme()" class="w-10 h-10 flex items-center justify-center rounded-full glass shadow-sm"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
            </div>
        </header>

        <nav id="nav-container" class="flex p-1 rounded-2xl mb-6 shadow-inner">
            <button onclick="switchTab('home')" id="tab-home" class="flex-1 py-2.5 text-xs font-bold rounded-xl nav-btn-active">Accueil</button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-2.5 text-xs font-bold rounded-xl">Calendrier</button>
            <button onclick="switchTab('stats')" id="tab-stats" class="flex-1 py-2.5 text-xs font-bold rounded-xl">Stats</button>
        </nav>

        <div id="view-home" class="space-y-6 animate-fade">
            <div class="glass p-6 rounded-[2.5rem] shadow-xl text-center">
                <span class="text-[10px] font-bold uppercase opacity-40">Selles enregistrées</span>
                <div id="counter" class="text-6xl font-black text-slate-800 dark:text-white mt-1">0</div>
                
                <div class="space-y-6 text-left mt-6">
                    <div>
                        <span class="text-[10px] font-bold uppercase opacity-40 mb-3 block text-center">Médicaments</span>
                        <div class="flex justify-center gap-2">
                            <input type="checkbox" id="m-none" class="hidden peer/none" onchange="toggleMeds('none', 'home')">
                            <label for="m-none" class="flex-1 py-3 text-center rounded-xl border-2 peer-checked/none:bg-slate-400 peer-checked/none:text-white font-bold text-xs">RIEN</label>
                            <input type="checkbox" id="m-forlax" class="hidden peer/forlax" onchange="toggleMeds('forlax', 'home')">
                            <label for="m-forlax" class="flex-1 py-3 text-center rounded-xl border-2 peer-checked/forlax:bg-blue-500 peer-checked/forlax:text-white font-bold text-xs">FORLAX</label>
                            <input type="checkbox" id="m-flavon" class="hidden peer/flavon" onchange="toggleMeds('flavon', 'home')">
                            <label for="m-flavon" class="flex-1 py-3 text-center rounded-xl border-2 peer-checked/flavon:bg-blue-500 peer-checked/flavon:text-white font-bold text-xs">FLAVON</label>
                        </div>
                    </div>

                    <div>
                        <span class="text-[10px] font-bold uppercase opacity-40 mb-3 block text-center">État</span>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="radio" name="cons" id="r-normal" value="Normal" class="hidden peer/n"><label for="r-normal" class="py-3 text-center rounded-xl border peer-checked/n:bg-emerald-500 peer-checked/n:text-white text-[11px] font-bold">Normal</label>
                            <input type="radio" name="cons" id="r-molle" value="Molle" class="hidden peer/m"><label for="r-molle" class="py-3 text-center rounded-xl border peer-checked/m:bg-blue-500 peer-checked/m:text-white text-[11px] font-bold">Molle</label>
                            <input type="radio" name="cons" id="r-diar" value="Diarrhée" class="hidden peer/di"><label for="r-diar" class="py-3 text-center rounded-xl border peer-checked/di:bg-orange-500 peer-checked/di:text-white text-[11px] font-bold">Diar.</label>
                            <input type="radio" name="cons" id="r-dur" value="Dur" class="hidden peer/du"><label for="r-dur" class="py-3 text-center rounded-xl border peer-checked/du:bg-red-500 peer-checked/du:text-white text-[11px] font-bold">Dur</label>
                            <input type="radio" name="cons" id="r-const" value="Constipation" class="hidden peer/co"><label for="r-const" class="py-3 text-center rounded-xl border peer-checked/co:bg-purple-500 peer-checked/co:text-white text-[11px] font-bold">Const.</label>
                        </div>
                    </div>

                    <input type="text" id="note-input" placeholder="Note..." class="w-full p-4 rounded-2xl text-sm">
                    <button onclick="addEntry()" class="w-full btn-main text-white py-5 rounded-[2rem] font-black text-lg">ENREGISTRER</button>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="text-[10px] font-black uppercase opacity-40 px-4">Historique</h3>
                <div id="recent-list" class="space-y-3"></div>
            </div>
        </div>

        <div id="view-calendar" class="hidden animate-fade space-y-4">
            <h2 class="font-black text-xl px-2">Archives</h2>
            <div id="month-grid" class="grid grid-cols-2 gap-3"></div>
            <div id="cal-detail-list" class="space-y-3 pt-4"></div>
        </div>

        <div id="view-stats" class="hidden animate-fade space-y-6">
            <div class="glass p-6 rounded-[2rem] h-[300px]"><canvas id="chartConsistence"></canvas></div>
            <div class="glass p-6 rounded-[2rem] h-[300px]"><canvas id="chartMeds"></canvas></div>
        </div>

        <footer class="mt-8 text-center"><a href="mailto:koussy@gmail.com" class="text-[10px] font-bold opacity-30 uppercase tracking-widest">CRÉDIT KOUSSY</a></footer>
    </div>

    <script>
        let entries = [];
        let videoTrack = null;
        let charts = { cons: null, meds: null };
        const COLORS = { 'Normal':'#10b981', 'Molle':'#3b82f6', 'Diarrhée':'#f97316', 'Dur':'#ef4444', 'Constipation':'#8b5cf6', 'N/A':'#94a3b8' };

        // --- DÉMARRAGE SÉCURISÉ ---
        function hideLoader() {
            const loader = document.getElementById('loader');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 600);
            }
        }

        window.onload = function() {
            try {
                const saved = localStorage.getItem('selles_data');
                if (saved) entries = JSON.parse(saved);
                
                const isDark = localStorage.getItem('selles_dark') === 'true';
                if (isDark) { document.body.classList.add('dark'); document.getElementById('theme-icon').className = 'fa-solid fa-sun'; }
                
                updateUI();
                hideLoader();
            } catch (err) {
                console.error(err);
                hideLoader(); // On cache même si erreur
            }
        };

        async function toggleTorch() {
            try {
                if (!videoTrack) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    videoTrack = stream.getVideoTracks()[0];
                }
                const caps = videoTrack.getCapabilities();
                if (caps.torch) await videoTrack.applyConstraints({ advanced: [{ torch: !videoTrack.getSettings().torch }] });
            } catch (e) { alert("Caméra non accessible"); }
        }

        function toggleMeds(type, context) {
            const none = document.getElementById('m-none');
            const forlax = document.getElementById('m-forlax');
            const flavon = document.getElementById('m-flavon');
            if (type === 'none' && none.checked) { forlax.checked = false; flavon.checked = false; }
            else if (none.checked) none.checked = false;
        }

        function addEntry() {
            const cons = document.querySelector('input[name="cons"]:checked');
            if(!cons) return alert("Choisissez un état");
            const meds = [];
            if(document.getElementById('m-forlax').checked) meds.push('Forlax');
            if(document.getElementById('m-flavon').checked) meds.push('Flavon');

            entries.unshift({ id: Date.now(), timestamp: new Date().toISOString(), cons: cons.value, meds: meds, note: document.getElementById('note-input').value });
            localStorage.setItem('selles_data', JSON.stringify(entries));
            updateUI();
            
            // Reset
            document.getElementById('note-input').value = "";
            document.querySelectorAll('input[name="cons"]').forEach(r => r.checked = false);
            ['m-none','m-forlax','m-flavon'].forEach(id => document.getElementById(id).checked = false);
        }

        function updateUI() {
            document.getElementById('counter').innerText = entries.length;
            renderRecent();
            if(document.getElementById('view-stats').style.display !== 'none') renderStats();
        }

        function renderRecent() {
            const list = document.getElementById('recent-list');
            list.innerHTML = entries.slice(0, 5).map(e => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center animate-fade">
                    <div class="flex items-center gap-4">
                        <div class="w-2 h-10 rounded-full" style="background:${COLORS[e.cons]}"></div>
                        <div><div class="text-xs font-black">${new Date(e.timestamp).toLocaleTimeString([], {hour:'2h',minute:'2h'})}</div><div class="text-[10px] opacity-40 font-bold uppercase">${e.cons}</div></div>
                    </div>
                    <div class="text-[9px] font-bold opacity-30">${e.meds.join(' · ') || 'AUCUN'}</div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            ['home', 'calendar', 'stats'].forEach(t => {
                document.getElementById('view-'+t).style.display = (t === tab) ? 'block' : 'none';
                document.getElementById('tab-'+t).classList.toggle('nav-btn-active', t === tab);
            });
            if(tab === 'stats') renderStats();
            if(tab === 'calendar') renderCalendar();
        }

        function toggleTheme() {
            const dark = document.body.classList.toggle('dark');
            localStorage.setItem('selles_dark', dark);
            document.getElementById('theme-icon').className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        function renderStats() {
            const cData = {}, mData = { Forlax:0, Flavon:0, Aucun:0 };
            entries.forEach(e => {
                cData[e.cons] = (cData[e.cons] || 0) + 1;
                if(e.meds.length === 0) mData.Aucun++; else e.meds.forEach(m => mData[m]++);
            });

            if(charts.cons) charts.cons.destroy();
            charts.cons = new Chart(document.getElementById('chartConsistence'), {
                type:'doughnut', data:{ labels:Object.keys(cData), datasets:[{data:Object.values(cData), backgroundColor:Object.keys(cData).map(k=>COLORS[k])}] },
                options:{ maintainAspectRatio:false, plugins:{ legend:{position:'bottom'} } }
            });

            if(charts.meds) charts.meds.destroy();
            charts.meds = new Chart(document.getElementById('chartMeds'), {
                type:'bar', data:{ labels:Object.keys(mData), datasets:[{data:Object.values(mData), backgroundColor:'#3b82f6'}] },
                options:{ maintainAspectRatio:false, plugins:{ legend:{display:false} } }
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('month-grid');
            const months = {};
            entries.forEach(e => {
                const m = new Date(e.timestamp).toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
                months[m] = (months[m] || 0) + 1;
            });
            grid.innerHTML = Object.entries(months).map(([m, c]) => `
                <div class="glass p-4 rounded-2xl">
                    <div class="text-[10px] font-black uppercase opacity-40">${m}</div>
                    <div class="text-xl font-black">${c} <span class="text-xs opacity-20">selles</span></div>
                </div>
            `).join('');
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
</body>
</html>
